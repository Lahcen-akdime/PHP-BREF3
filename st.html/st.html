<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-Day Development Schedule - Todo List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #16213e 100%);
            color: #e0e7ff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.1) 0%, rgba(6, 182, 212, 0.1) 100%);
            border-radius: 12px;
            border-left: 4px solid #22d3ee;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #22d3ee;
            text-shadow: 0 2px 10px rgba(34, 211, 238, 0.3);
        }

        .header p {
            color: #a5f3fc;
            font-size: 1.1em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 58, 138, 0.6);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #22d3ee;
            backdrop-filter: blur(10px);
        }

        .stat-card h3 {
            color: #a5f3fc;
            font-size: 0.9em;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #22d3ee;
        }

        .progress-section {
            margin-bottom: 30px;
        }

        .progress-bar {
            background: rgba(30, 58, 138, 0.6);
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #06b6d4;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #06b6d4 0%, #22d3ee 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
            font-weight: bold;
            font-size: 0.9em;
        }

        .days-container {
            display: grid;
            gap: 30px;
            margin-bottom: 40px;
        }

        .day-section {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(34, 211, 238, 0.2);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .day-header {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.2) 0%, rgba(6, 182, 212, 0.1) 100%);
            padding: 20px;
            border-bottom: 2px solid rgba(34, 211, 238, 0.3);
        }

        .day-header h2 {
            color: #22d3ee;
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .session {
            padding: 20px;
            border-bottom: 1px solid rgba(34, 211, 238, 0.1);
        }

        .session:last-child {
            border-bottom: none;
        }

        .session-time {
            color: #22d3ee;
            font-weight: bold;
            font-size: 0.95em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .session-duration {
            background: rgba(34, 211, 238, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #a5f3fc;
        }

        .steps {
            margin-left: 20px;
        }

        .step {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 12px;
            padding: 12px;
            background: rgba(6, 182, 212, 0.05);
            border-radius: 6px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .step:hover {
            background: rgba(6, 182, 212, 0.1);
            border-left: 3px solid #22d3ee;
            padding-left: 17px;
        }

        .step.completed {
            opacity: 0.6;
        }

        .step.completed .step-text {
            text-decoration: line-through;
            color: #64748b;
        }

        .step input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: #22d3ee;
            flex-shrink: 0;
        }

        .step-content {
            flex: 1;
        }

        .step-text {
            color: #e0e7ff;
            margin-bottom: 5px;
            font-size: 0.95em;
        }

        .step-time {
            color: #64748b;
            font-size: 0.85em;
        }

        .end-marker {
            padding: 12px;
            background: rgba(34, 211, 238, 0.15);
            border-left: 3px solid #22d3ee;
            color: #a5f3fc;
            margin: 15px 20px 0 20px;
            border-radius: 4px;
            font-weight: 500;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 10px 20px;
            background: rgba(34, 211, 238, 0.2);
            border: 1px solid #22d3ee;
            color: #22d3ee;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .pagination button:hover {
            background: rgba(34, 211, 238, 0.3);
            transform: translateY(-2px);
        }

        .pagination button.active {
            background: #22d3ee;
            color: #0f172a;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .session-time {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 4-Day Development Schedule</h1>
            <p>Sports Management System - Complete Build</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Tasks</h3>
                <div class="value" id="totalTasks">0</div>
            </div>
            <div class="stat-card">
                <h3>Completed</h3>
                <div class="value" id="completedTasks">0</div>
            </div>
            <div class="stat-card">
                <h3>Remaining</h3>
                <div class="value" id="remainingTasks">0</div>
            </div>
            <div class="stat-card">
                <h3>Progress</h3>
                <div class="value" id="progressPercent">0%</div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;">
                    <span id="progressText">0%</span>
                </div>
            </div>
        </div>

        <div class="days-container" id="daysContainer"></div>

        <div class="pagination" id="pagination"></div>
    </div>

    <script>
        const schedule = [
            {
                day: 1,
                title: "DATABASE + BASE OBJECT WIRING",
                sessions: [
                    {
                        time: "10:50 – 12:30",
                        duration: "1h40",
                        title: "Database & Object Alignment",
                        steps: [
                            "Create all tables (personne, joueur, coach, equipe, contrat, transfert) — 25 min",
                            "Verify foreign keys & constraints — 20 min",
                            "Align table fields with existing constructors — 25 min",
                            "Test insert/select manually (basic data) — 30 min"
                        ],
                        end: "Database stable & matches your classes."
                    },
                    {
                        time: "12:30 – 13:15",
                        duration: "45 min",
                        title: "Pause",
                        isPause: true,
                        steps: []
                    },
                    {
                        time: "13:15 – 15:30",
                        duration: "2h15",
                        title: "Repository Layer Creation",
                        steps: [
                            "Create one DB connection handler — 20 min",
                            "Create repository for Personne (read only) — 25 min",
                            "Create repository for Joueur & Coach — 30 min",
                            "Create repository for Équipe — 30 min",
                            "Create repository for Contrat & Transfert — 30 min"
                        ],
                        end: "SQL isolated from entities."
                    },
                    {
                        time: "15:30 – 15:45",
                        duration: "15 min",
                        title: "Pause",
                        isPause: true,
                        steps: []
                    },
                    {
                        time: "15:45 – 17:30",
                        duration: "1h45",
                        title: "Object Hydration",
                        steps: [
                            "Convert DB rows → Personne objects — 30 min",
                            "Convert DB rows → Joueur / Coach (inheritance) — 35 min",
                            "Convert DB rows → Équipe & Contrat — 40 min"
                        ],
                        end: "Objects are created from DB cleanly."
                    }
                ]
            },
            {
                day: 2,
                title: "CORE BUSINESS LOGIC (NO UI)",
                sessions: [
                    {
                        time: "10:50 – 12:30",
                        duration: "1h40",
                        title: "Budget & Encapsulation Logic",
                        steps: [
                            "Implement budget increase/decrease in Équipe — 35 min",
                            "Enforce budget protection (no direct access) — 25 min",
                            "Validate insufficient funds scenario — 40 min"
                        ],
                        end: "Budget is safe & controlled."
                    },
                    {
                        time: "12:30 – 13:15",
                        duration: "45 min",
                        title: "Pause",
                        isPause: true,
                        steps: []
                    },
                    {
                        time: "13:15 – 15:30",
                        duration: "2h15",
                        title: "FinancialEngine (CRITICAL)",
                        steps: [
                            "Create transfer execution flow — 30 min",
                            "Start/commit/rollback transaction — 30 min",
                            "Budget verification logic — 25 min",
                            "Contract creation + lock fields — 25 min",
                            "Transfer record save (success/fail) — 25 min"
                        ],
                        end: "Atomic transfers working."
                    },
                    {
                        time: "15:30 – 15:45",
                        duration: "15 min",
                        title: "Pause",
                        isPause: true,
                        steps: []
                    },
                    {
                        time: "15:45 – 17:30",
                        duration: "1h45",
                        title: "Failure Scenarios",
                        steps: [
                            "Simulate insufficient budget — 30 min",
                            "Simulate invalid team/player — 25 min",
                            "Ensure rollback integrity — 30 min",
                            "Validate DB unchanged on failure — 20 min"
                        ],
                        end: "System is fail-safe."
                    }
                ]
            },
            {
                day: 3,
                title: "ROLES + POLYMORPHISM",
                sessions: [
                    {
                        time: "10:50 – 12:30",
                        duration: "1h40",
                        title: "Admin Actions",
                        steps: [
                            "Create admin access guard — 25 min",
                            "Connect admin to roster management — 35 min",
                            "Connect admin to FinancialEngine — 40 min"
                        ],
                        end: "Admin can fully control system."
                    },
                    {
                        time: "12:30 – 13:15",
                        duration: "45 min",
                        title: "Pause",
                        isPause: true,
                        steps: []
                    },
                    {
                        time: "13:15 – 15:30",
                        duration: "2h15",
                        title: "Journalist Logic",
                        steps: [
                            "Implement annual cost polymorphism — 30 min",
                            "Journalist comparison feature — 40 min",
                            "Private transfer history access — 35 min",
                            "Static log formatter — 30 min"
                        ],
                        end: "Journalist tools operational."
                    },
                    {
                        time: "15:30 – 15:45",
                        duration: "15 min",
                        title: "Pause",
                        isPause: true,
                        steps: []
                    },
                    {
                        time: "15:45 – 17:30",
                        duration: "1h45",
                        title: "Visitor Read-Only Access",
                        steps: [
                            "Public player/team listing — 35 min",
                            "Public transfer history (filtered) — 30 min",
                            "Public profile abstraction — 40 min"
                        ],
                        end: "No private data leakage."
                    }
                ]
            },
            {
                day: 4,
                title: "MULTI-PAGE FLOW + FINAL CHECK",
                sessions: [
                    {
                        time: "10:50 – 12:30",
                        duration: "1h40",
                        title: "Page Integration",
                        steps: [
                            "Wire repositories to pages — 35 min",
                            "Secure restricted pages — 30 min",
                            "Navigation flow check — 35 min"
                        ],
                        end: "Pages talk only to logic."
                    },
                    {
                        time: "12:30 – 13:15",
                        duration: "45 min",
                        title: "Pause",
                        isPause: true,
                        steps: []
                    },
                    {
                        time: "13:15 – 15:30",
                        duration: "2h15",
                        title: "JS Features (Frontend Logic)",
                        steps: [
                            "Visitor search filter — 40 min",
                            "Journalist dynamic filtering — 45 min",
                            "UI consistency check — 50 min"
                        ],
                        end: "Frontend logic complete."
                    },
                    {
                        time: "15:30 – 15:45",
                        duration: "15 min",
                        title: "Pause",
                        isPause: true,
                        steps: []
                    },
                    {
                        time: "15:45 – 17:30",
                        duration: "1h45",
                        title: "Final Validation",
                        steps: [
                            "Full transfer simulation — 30 min",
                            "Role restriction verification — 30 min",
                            "Database integrity check — 25 min",
                            "Final cleanup — 20 min"
                        ],
                        end: "Project complete & validated."
                    }
                ]
            }
        ];

        let currentPage = 1;
        const itemsPerPage = 2;
        let checkedTasks = JSON.parse(localStorage.getItem('devScheduleTasks')) || {};

        function generateDays() {
            const daysContainer = document.getElementById('daysContainer');
            daysContainer.innerHTML = '';

            const totalDays = Math.ceil(schedule.length / itemsPerPage);
            const startIdx = (currentPage - 1) * itemsPerPage;
            const endIdx = Math.min(startIdx + itemsPerPage, schedule.length);

            for (let i = startIdx; i < endIdx; i++) {
                const day = schedule[i];
                const dayHtml = `
                    <div class="day-section">
                        <div class="day-header">
                            <h2>🔵 DAY ${day.day} — ${day.title}</h2>
                        </div>
                        ${day.sessions.map((session, sessionIdx) => `
                            <div class="session">
                                <div class="session-time">
                                    <span>${session.time}</span>
                                    <span class="session-duration">${session.duration}</span>
                                </div>
                                <strong style="color: #a5f3fc;">${session.title}</strong>
                                ${!session.isPause ? `
                                    <div class="steps">
                                        ${session.steps.map((step, stepIdx) => {
                                            const taskId = `day${day.day}-session${sessionIdx}-step${stepIdx}`;
                                            const isChecked = checkedTasks[taskId] || false;
                                            return `
                                                <div class="step ${isChecked ? 'completed' : ''}" onclick="toggleTask('${taskId}')">
                                                    <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="event.stopPropagation()">
                                                    <div class="step-content">
                                                        <div class="step-text">${step}</div>
                                                    </div>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                    <div class="end-marker">✅ End: ${session.end}</div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
                daysContainer.innerHTML += dayHtml;
            }

            generatePagination();
            updateStats();
        }

        function generatePagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(schedule.length / itemsPerPage);
            pagination.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                const button = document.createElement('button');
                button.textContent = `Day ${i}`;
                button.className = i === currentPage ? 'active' : '';
                button.onclick = () => {
                    currentPage = i;
                    generateDays();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                pagination.appendChild(button);
            }
        }

        function toggleTask(taskId) {
            checkedTasks[taskId] = !checkedTasks[taskId];
            localStorage.setItem('devScheduleTasks', JSON.stringify(checkedTasks));
            generateDays();
        }

        function updateStats() {
            let totalTasks = 0;
            let completedCount = 0;

            schedule.forEach((day, dayIdx) => {
                day.sessions.forEach((session, sessionIdx) => {
                    session.steps.forEach((step, stepIdx) => {
                        totalTasks++;
                        const taskId = `day${day.day}-session${sessionIdx}-step${stepIdx}`;
                        if (checkedTasks[taskId]) completedCount++;
                    });
                });
            });

            const remaining = totalTasks - completedCount;
            const percent = totalTasks > 0 ? Math.round((completedCount / totalTasks) * 100) : 0;

            document.getElementById('totalTasks').textContent = totalTasks;
            document.getElementById('completedTasks').textContent = completedCount;
            document.getElementById('remainingTasks').textContent = remaining;
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = percent + '%';
        }

        // Initialize
        generateDays();
    </script>
</body>
</html>
